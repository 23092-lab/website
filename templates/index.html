<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>osu! search home</title>
    <link rel="stylesheet" href="/static/css/stylesheet.css">
</head>
<body>

    <div class="container">
        <a href="/ranking">All rankings</a>
        <br>
        <br>
        <br>
         Search the database (with or without country):
        <form method="post" action="/search"> <!-- everything inside is a filter to be sent to the python script -->
                <select name="country" id="country" class="select"> <!-- drop down for country -->
                    <option value="">All Countries</option>
                    <option value="🇰🇷">South Korea 🇰🇷</option>
                    <option value="🇨🇦">Canada 🇨🇦</option>
                    <option value="🇵🇭">Philippines 🇵🇭</option>
                    <option value="🇦🇺">Australia 🇦🇺</option>
                    <option value="🇺🇸">United States 🇺🇸</option>
                    <option value="🇹🇼">Taiwan 🇹🇼</option>
                    <option value="🇵🇱">Poland🇵🇱</option>
                    <option value="🇩🇪">Germany 🇩🇪</option>
                </select>
            <select name="sort" id="sort">  <!-- drop down for popularity sorting -->
                 <option value="asc">Ascending popularity</option>
                <option value="desc">Descending popularity</option>
            </select>
            <br>
            <input type="text" name="search" id="search"> <!-- searching text box-->
            <input type="submit" value="search">
        </form>
    </div>
</body>
</html>
