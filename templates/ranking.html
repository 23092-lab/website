<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aura rankings</title>
    <link rel="stylesheet" href="/static/css/stylesheet.css">
</head>
<body>

<div class="container">
<a href="/">Back to search</a>
    <table><th class="top">name</th> <th class="top">popularity</th> <th class="top">aura levels</th> <th class="top">active</th> <th class="top">country</th>
    {% for rank in ranks %}
    <tr>
        <th>{{ rank[0] }}</th>
        <th>{{ rank[1] }}</th>
        <th>{{ rank[2] }}</th>
        <th>{{ rank[3] }}</th>
        <th>{{ rank[4] }}</th>

    </tr>
    {% endfor %}
</table>
</div>
</body>
</html>
