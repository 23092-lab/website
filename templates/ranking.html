<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aura rankings</title>
    <link rel="stylesheet" href="/static/css/stylesheet.css">
</head>
<body>
<div class="container">
<table><th>number</th> <th>name</th> <th>ranking</th> <th>level</th>
    {% for rank in ranks %}
    <tr>
        <th>{{ rank[0] }}</th>
        <th>{{ rank[1] }}</th>
        <th>{{ rank[2] }}</th>
        <th>{{ rank[3] }}</th>
    </tr>
    {% endfor %}
</table>
</div>
</body>
</html>
