<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aura rankings</title>
    <link rel="stylesheet" href="/static/css/stylesheet.css">
</head>
<body>
<div class="parallax">

<div class="container">
<a href="/">back</a>
    <table><th class="top">number</th> <th class="top">name</th> <th class="top">ranking</th> <th class="top">level</th> <th class="top">country</th>
    {% for rank in ranks %}
    <tr>
        <th>{{ rank[0] }}</th>
        <th>{{ rank[1] }}</th>
        <th>{{ rank[2] }}</th>
        <th>{{ rank[3] }}</th>
        <th>{{ rank[4] }}</th>

    </tr>
    {% endfor %}
</table>
</div>

</div>
</body>
</html>
